version: '3.8'

services:
  multi-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-site-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-multi-site-secret-key-change-in-production}
      - NEXTAUTH_URL=http://192.168.6.6:3000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
